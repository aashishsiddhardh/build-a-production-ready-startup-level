services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ayursage
      POSTGRES_PASSWORD: ayursage
      POSTGRES_DB: ayursage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayursage"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ayursage:ayursage@db:5432/ayursage
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      ENVIRONMENT: production
      # Optional: set LLM_API_KEY to enable the model-phrased assistant layer.
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build: .
    depends_on:
      - backend
    environment:
      VITE_API_URL: /api
    ports:
      - "3000:80"

volumes:
  pgdata:
