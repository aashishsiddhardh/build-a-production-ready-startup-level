services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ayursage
      POSTGRES_PASSWORD: ayursage
      POSTGRES_DB: ayursage
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayursage"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://ayursage:ayursage@db:5432/ayursage
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: .
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db_data:
